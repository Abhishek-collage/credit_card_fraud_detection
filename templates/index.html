<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Card Fraud Detection System</title>
    <!-- Bootstrap 5 CSS for base styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .main-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border: none;
        }
        .header-title {
            color: #1a2530;
            font-weight: 700;
        }
        .sample-btn {
            font-size: 0.85rem;
            border-radius: 6px;
            transition: all 0.2s ease-in-out;
        }
        .sample-btn:hover {
            transform: translateY(-1px);
        }
        .feature-textarea {
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            border-radius: 8px;
            border: 1px solid #ced4da;
        }
        .feature-textarea:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
        }
        .result-box {
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-10 col-xl-8">
            <div class="card main-card p-4 p-md-5">
                
                <!-- Header -->
                <div class="text-center mb-4">
                    <h2 class="header-title">💳 Credit Card Fraud Detection</h2>
                    <p class="text-muted">FastAPI & Machine Learning MLOps Web Portal</p>
                </div>

                <!-- Error Alert -->
                {% if error %}
                <div class="alert alert-warning alert-dismissible fade show" role="alert">
                    <strong>⚠️ Attention:</strong> {{ error }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                {% endif %}

                <!-- Form -->
                <form action="/predict" method="post">
                    <div class="mb-3">
                        <label for="features_input" class="form-label fw-bold text-secondary">
                            Input Transaction Features (Time, V1 to V28, Amount)
                        </label>
                        <p class="small text-muted mb-2">
                            Paste the row values separated by commas or line breaks (exactly 30 numeric variables).
                        </p>
                        <textarea 
                            class="form-control feature-textarea" 
                            id="features_input" 
                            name="features_input" 
                            rows="7" 
                            placeholder="0.0, -1.359807, -0.072781, 2.536347, 1.378155, ... 149.62"
                            required>{% if previous_input %}{{ previous_input }}{% endif %}</textarea>
                    </div>

                    <!-- Test Sample Buttons -->
                    <div class="d-flex flex-wrap align-items-center gap-2 mb-4">
                        <span class="small fw-semibold text-muted">Test with Live Samples:</span>
                        <button type="button" class="btn btn-outline-success btn-sm sample-btn" onclick="loadNormalSample()">
                            Load Normal Sample (Class 0)
                        </button>
                        <button type="button" class="btn btn-outline-danger btn-sm sample-btn" onclick="loadFraudSample()">
                            Load Fraud Sample (Class 1)
                        </button>
                    </div>

                    <!-- Submit Button -->
                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary btn-lg fw-bold">
                            🔍 Run Fraud Analysis Pipeline
                        </button>
                    </div>
                </form>

                <!-- Prediction Output Result -->
                {% if prediction %}
                <div class="mt-4">
                    <div class="alert alert-{{ alert_class }} result-box text-center p-3 shadow-sm" role="alert">
                        {{ prediction }}
                    </div>
                </div>
                {% endif %}

            </div>
        </div>
    </div>
</div>

<!-- JavaScript for Sample Loading & Auto-Formatting -->
<script>
    // Sample Data: Normal Transaction (Class 0) - 30 features
    const normalSample = "0.0, -1.359807, -0.072781, 2.536347, 1.378155, -0.338321, 0.462388, 0.239599, 0.098698, 0.363787, 0.090794, -0.551600, -0.617801, -0.991390, -0.311169, 1.468177, -0.470401, 0.207971, 0.025791, 0.403993, 0.251412, -0.018307, 0.277838, -0.110474, 0.066928, 0.128539, -0.189115, 0.133558, -0.021053, 149.62";

    // Sample Data: Fraudulent Transaction (Class 1) - 30 features
    const fraudSample = "406.0, -2.312227, 1.951992, -1.609851, 3.997906, -0.522188, -1.426545, -2.537387, 1.391657, -2.770089, -2.772272, 3.202033, -2.899907, -0.595222, -4.289254, 0.389724, -1.140747, -2.830056, -0.016822, 0.416956, 0.126911, 0.517232, -0.035049, -0.465211, 0.320198, 0.044519, 0.177840, 0.261145, -0.143276, 0.00";

    function loadNormalSample() {
        document.getElementById("features_input").value = normalSample;
    }

    function loadFraudSample() {
        document.getElementById("features_input").value = fraudSample;
    }
</script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
